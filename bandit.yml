# =============================================================================
# bandit.yml - Configuration SAST Python (CI RootWarden)
# =============================================================================
# Lance par la CI : bandit -r . -ll -ii -c bandit.yml --exclude ./tests,./__pycache__
#   -ll : ne remonte que les findings de severite >= MEDIUM
#   -ii : ne remonte que les findings de confiance  >= MEDIUM
#
# Les exclusions ci-dessous sont des FAUX POSITIFS verifies (cf
# CONTRIBUTING-SECURITY.md), neutralises ici plutot que par des `# nosec`
# disperses, pour garder un signal CI propre sans masquage silencieux.
# =============================================================================

skips:
  # B608 - hardcoded_sql_expressions : nos requetes assemblent des f-strings
  # UNIQUEMENT pour des noms de colonnes issus d'une whitelist en dur
  # (ex _FILTER_ENUMS) ou des compteurs de placeholders (','.join(['%s']*n)).
  # 100% des VALEURS utilisateur passent par des placeholders parametres (%s).
  # Aucune donnee non fiable n'entre dans le texte SQL. (SQLi couvert aussi par
  # la revue manuelle + les conventions A03.)
  - B608
  # B110 - try_except_pass : blocs best-effort volontaires (notifications,
  # journalisation, enrichissement EPSS/KEV, auto-ticket) qui ne doivent JAMAIS
  # casser l'action principale qu'ils accompagnent. L'echec est journalise en
  # debug ailleurs ; le `pass` est intentionnel.
  - B110
  # B601 - paramiko_calls : RootWarden execute des commandes a distance via
  # Paramiko. TOUS les arguments interpoles sont passes par shlex.quote (cf
  # ssh_utils.execute_as_root, docker_monitor, etc.). Pattern verifie.
  - B601
  # B507 - ssh_no_host_key_verification : la plateforme se connecte a un parc de
  # serveurs sans known_hosts pre-seede -> AutoAddPolicy (TOFU). DECISION DESIGN
  # documentee (cf ROADMAP.md "Cle d'hote SSH : AutoAddPolicy"). Risque accepte.
  - B507
  # B108 - hardcoded_tmp_directory : scripts SSH transitoires ecrits dans /tmp
  # cote serveur distant (su -c, deploiements), avec noms aleatoires + mode 0600
  # + nettoyage. Usage intentionnel.
  - B108
