name: rootwarden

services:

  # ─────────────────────────────────────────────────────────────
  # Frontend PHP + Apache
  # ─────────────────────────────────────────────────────────────
  laravel:
    build:
      context: .
      dockerfile: ./laravel/Dockerfile
    container_name: rootwarden_laravel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # ══ ECHANGE DES PORTS, 2026-09-06 — le geste SEPARE annonce ci-dessous a eu
      #    lieu. Le PORTAGE prend les ports du portail historique (8080/8443) et le
      #    legacy part sur ceux que le portage abandonne (8444/8446).
      #    Demande de l'exploitant : « les memes ports qu'avant, et on degage les
      #    ports du legacy sur une autre plage ». Echange PUR : aucun port neuf a
      #    ouvrir, et les deux valeurs sont deja connues de l'outillage.
      #
      # ⚠ UNE TRACE DE `8444` DANS UN DOCUMENT ANTERIEUR AU 2026-09-06 DESIGNE LE
      #    PORTAGE ; APRES, ELLE DESIGNE LE LEGACY. C'est le cout accepte de
      #    l'echange pur. Dater avant d'interpreter.
      #
      # 8080 -> 80 : ne sert plus de contenu, redirige vers HTTPS.
      - "${LARAVEL_PORT:-8080}:80"
      # ⚠ AJOUTE LE 2026-09-06 : le portage servait l'authentification EN CLAIR.
      # Mesure : seul 8444->80 etait publie, `https://…:8444` rendait 000, et le
      # formulaire postait sur `http://`. Mot de passe et code TOTP transitaient
      # en clair, alors que le legacy qu'on remplace a du TLS depuis toujours.
      # Le defaut doit rester EGAL a celui de l'entrypoint, qui construit la
      # redirection HTTP -> HTTPS avec ce port.
      #
      # ⚠⚠ AU 2026-09-06 CETTE EGALITE EST ROMPUE, ET LE RATTRAPER EST UN PREALABLE
      #    A LA RECREATION. `laravel/docker-entrypoint.sh:86` porte encore
      #    `LARAVEL_HTTPS_PORT="${LARAVEL_HTTPS_PORT:-8446}"`. Le fichier est sous
      #    GEL (LOT 4 en cours) : le correctif est prepare, pas applique.
      #
      #    Ce que l'oubli produirait n'est PAS une panne : un conteneur demarre
      #    sans la variable batirait sa redirection HTTP -> HTTPS vers `:8446` —
      #    port que le LEGACY occupe desormais. **Un operateur se connectant au
      #    portage serait silencieusement depose sur l'ANCIEN portail**, qui
      #    fonctionne et qui accepte ses identifiants. Aucun message d'erreur.
      - "${LARAVEL_HTTPS_PORT:-8443}:443"
    volumes:
      - ./laravel:/var/www/html
      # Certificats : MEME volume que le service `php`, donc meme certificat pour
      # les deux portails. Rien a generer — et si le repertoire est vide, c'est
      # l'entrypoint qui produit un auto-signe, avec le nommage du legacy.
      - ./certs:/var/www/certs
      # Le numéro de version a UNE seule source : legacy/version.txt, écrit par le
      # mécanisme de bump. Le portage le LIT, en lecture seule, et n'en tient pas de
      # copie — une seconde copie dériverait, et ce chiffre a déjà dérivé deux fois
      # le 2026-08-27 (resté à 1.38.17 pendant deux bumps, puis trois commits sur le
      # même numéro). Le chemin reste `legacy/` tant que le legacy est servi ; son
      # emplacement à l'extinction du legacy est une question ouverte (§4.1 ter).
      - ./legacy/version.txt:/var/www/html/version.txt:ro
    env_file:
      - srv-docker.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # ⚠ CETTE SONDE A CERTIFIE UNE APPLICATION MORTE, et elle est devenue vide
      #    SANS QUE PERSONNE N'Y TOUCHE. Elle etait juste jusqu'au 2026-09-06 12:47
      #    (`8862849`, TLS sur le portage) : `:80` servait l'application. Depuis, ce
      #    vhost est une REDIRECTION SEULE — et `curl -f` echoue sur >= 400, PAS sur
      #    une 301, et sans `-L` il ne suit rien.
      #
      #    Mesure dans le conteneur, temoin au chemin invente :
      #      curl -fs http://localhost:80/up               exit 0   (HTTP 301)
      #      curl -fs http://localhost:80/zzz-invente      exit 0   (HTTP 301)  <-
      #      curl -fsk https://localhost:443/up            exit 0   (HTTP 200)
      #      curl -fsk https://localhost:443/zzz-invente   exit 22  (HTTP 404)  <-
      #
      #    La sonde certifiait qu'Apache REDIRIGE, jamais que l'application REPOND.
      #    `docker-compose.prod.yml` ne la redefinit pas : la production en herite.
      #    Releve par la session 8, temoin du chemin invente par la session 7.
      test: ["CMD", "curl", "-fsk", "https://localhost:443/up", "-o", "/dev/null"]
      interval: 30s
      # 20 s et non 5 s : sur un hôte Windows, le bind mount est ~258× plus lent
      # que le système de fichiers du conteneur (mesuré le 2026-08-17 : 9 300 ms
      # contre 36 ms pour lire 1 500 fichiers PHP). Le legacy charge ~5 fichiers
      # par page, Laravel plusieurs centaines : une première requête à froid
      # dépasse 6 s. Avec 5 s, la sonde échouait toujours et le conteneur restait
      # « unhealthy » en permanence, sans que l'application ait le moindre défaut.
      # Sur un hôte Linux, ce délai est sans objet.
      timeout: 20s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    networks:
      internal:
      external:

  # ─────────────────────────────────────────────────────────────
  # Backend Python (Flask) - réseau interne uniquement
  # Le frontend PHP le contacte via http://python:5000 (réseau Docker).
  # Ne pas exposer ce port sur l'hôte en production.
  # Pour déboguer en local, ajoutez : ports: ["5000:5000"]
  # ─────────────────────────────────────────────────────────────
  python:
    build: ./backend
    container_name: rootwarden_python
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./backend/ssl:/app/ssl
      - ./backups:/app/backups                   # Dumps MySQL automatiques
      - platform_ssh_keys:/app/platform_ssh      # Keypair Ed25519 persistee
      - ./mysql/migrations:/app/migrations:ro   # Fichiers de migration SQL (lecture seule)
    working_dir: /app
    expose:
      - "5000"
    # ⚠️  NE PAS exposer le port 5000 en production !
    # Le backend Python est accessible uniquement via le réseau Docker interne (php → python:5000).
    # Décommenter UNIQUEMENT pour le debug local (API directe sans proxy PHP) :
    # ports:
    #   - "${PYTHON_PORT:-5000}:5000"
    env_file:
      - srv-docker.env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - FLASK_APP=server.py
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:5000/test"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    networks:
      internal:
      external:

  # ─────────────────────────────────────────────────────────────
  # Base de données MySQL - réseau interne uniquement
  # Ne pas exposer le port MySQL sur l'hôte en production.
  # Pour accéder depuis un client SQL local, décommentez "ports".
  # ─────────────────────────────────────────────────────────────
  db:
    image: mysql:9.2.0
    container_name: rootwarden_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # ports:                            # ← Décommentez uniquement pour le débogage local
    #   - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - srv-docker.env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      internal:          # DB isolee sur reseau interne uniquement

  # ─────────────────────────────────────────────────────────────
  # Outils Composer (one-shot, ne tournent pas en continu)
  # Lancez manuellement si besoin :
  #   docker-compose run --rm composer
  #   docker-compose run --rm composer-update
  #
  # ⚠ CES DEUX SERVICES MONTAIENT `./legacy:/app`, DONC LA FAÇON DOCUMENTEE DE
  # GERER LES DEPENDANCES GERAIT LES MORTES.
  #
  #     legacy/composer.lock    14 paquets prod +  0 dev  — fige avec l'archive
  #     laravel/composer.lock   86 paquets prod + 33 dev  — l'application VIVANTE
  #
  # Un exploitant suivant la ligne ci-dessus installait ou mettait a jour le
  # legacy, et `laravel/composer.lock` restait inatteignable par l'outillage que
  # ce fichier documente. Troisieme occurrence de la meme espece le 2026-09-08,
  # apres `lint-php` (qui lintait 178 fichiers archives et 0 vivant) et `sca-php`
  # (dont l'audit CVE couvrait 14 paquets morts et jamais les 119 vivants).
  #
  # La cible est desormais EXPLICITE et surchargeable, par defaut l'application
  # vivante :
  #     docker-compose run --rm composer                       -> ./laravel
  #     COMPOSER_CIBLE=./legacy docker-compose run --rm composer -> l'archive
  #
  # ⛔ ET UN DANGER A CONNAITRE AVANT DE LANCER `composer` : la commande porte
  # `--no-dev`, donc elle RETIRE les dependances de developpement de `vendor/`.
  # PHPUnit en fait partie. Apres un `composer install --no-dev` sur `./laravel`,
  # la suite de tests ne tourne plus tant qu'on n'a pas rejoue une installation
  # SANS `--no-dev`. C'est le bon comportement pour une image de production et le
  # mauvais sur un poste de travail — dit ici plutot que decouvert apres coup.
  #
  # ⛔ Et `./laravel` est monte en BIND dans le conteneur qui SERT : une
  # installation regenere `vendor/` sous le service vivant. Ce n'est pas un geste
  # a jouer pendant qu'une suite tourne.
  # ─────────────────────────────────────────────────────────────
  composer:
    image: composer:2
    container_name: rootwarden_composer
    working_dir: /app
    volumes:
      - ${COMPOSER_CIBLE:-./laravel}:/app
    command: ["composer", "install", "--no-dev", "--optimize-autoloader"]
    profiles:
      - tools
    networks:
      external:

  composer-update:
    image: composer:2
    container_name: rootwarden_composer_update
    working_dir: /app
    volumes:
      - ${COMPOSER_CIBLE:-./laravel}:/app
    command: ["composer", "update", "--no-dev", "--optimize-autoloader"]
    profiles:
      - tools
    networks:
      external:

  # ─────────────────────────────────────────────────────────────
  # Mock OpenCVE API (preprod uniquement)
  # Simule l'API REST OpenCVE avec des CVE réalistes pour
  # tester le scan CVE sans instance complète.
  # ─────────────────────────────────────────────────────────────
  mock-opencve:
    build: ./mock-opencve
    container_name: rootwarden_mock_opencve
    hostname: mock-opencve
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - preprod
    expose:
      - "9090"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    networks:
      internal:

  # ─────────────────────────────────────────────────────────────
  # Serveur Debian de test (preprod uniquement)
  # Mini serveur SSH pour tester deploy_keys, updates, iptables, CVE scan.
  # Désactiver en production (profiles: [preprod])
  # ─────────────────────────────────────────────────────────────
  test-server:
    build: ./test-server
    container_name: rootwarden_test_server
    hostname: test-server
    restart: unless-stopped
    # PAS de `no-new-privileges` ici, contrairement aux autres services.
    #
    # Ce drapeau interdit toute elevation de privilege : `su` et `sudo` echouent
    # quel que soit le mot de passe, avec « The "no new privileges" flag is set ».
    # Or ce conteneur existe precisement pour recevoir des operations
    # privilegiees — deploiement de cles, mises a jour, iptables, scan CVE. Le
    # drapeau y annulait sa seule raison d'etre.
    #
    # Constate le 2026-08-18 : le mot de passe root stocke pour la machine 2
    # etait CORRECT (meme empreinte que TEST_SERVER_ROOT_PASSWORD) ; c'est bien
    # ce drapeau, et lui seul, qui faisait echouer `su`.
    #
    # Le durcissement reste en place sur php, laravel, python et db.
    profiles:
      - preprod
    # Passwords obligatoires depuis v1.17.0 - le container refuse de demarrer
    # si TEST_SERVER_ROOT_PASSWORD / TEST_SERVER_USER_PASSWORD ne sont pas
    # definis dans srv-docker.env. La verification stricte est faite par
    # l'entrypoint du Dockerfile (set -e + exit 1) plutot que par compose
    # pour ne pas bloquer la validation des autres profils.
    environment:
      ROOT_PASSWORD: ${TEST_SERVER_ROOT_PASSWORD:-}
      TEST_PASSWORD: ${TEST_SERVER_USER_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      internal:
        ipv4_address: 10.10.10.10

volumes:
  db_data:
  platform_ssh_keys:            # Keypair Ed25519 de la plateforme (persiste entre restarts)

networks:
  # Reseau interne : communication inter-conteneurs (db ↔ python ↔ php)
  # internal: true → pas d'acces internet, DB completement isolee
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.10.0/24
  # Reseau externe : acces internet sortant (SMTP, OpenCVE, SSH serveurs distants)
  # Seuls php et python y sont connectes
  external:
    driver: bridge
