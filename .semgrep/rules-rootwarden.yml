# Règles Semgrep custom RootWarden - dérivées de CONTRIBUTING-SECURITY.md
# Issues de l'audit OWASP Top 10 du 2026-05-19.
# Lancement local : semgrep --config .semgrep/rules-rootwarden.yml .
# CI : intégré dans .github/workflows/ci.yml semgrep step (bloquant sur main).

rules:
  # -------------------------------------------------------------------------
  # A03 Injection SQL - placeholders obligatoires
  # -------------------------------------------------------------------------
  - id: rw-sql-fstring-execute
    pattern-either:
      - pattern: $CUR.execute(f"...")
      - pattern: $CUR.execute("..." % $X)
      - pattern: $CUR.execute("...".format(...))
    message: |
      Construction de requete SQL par interpolation. Utiliser placeholders %s :
        cur.execute("SELECT ... WHERE id = %s", (id,))
      Voir CONTRIBUTING-SECURITY.md section 3.
    languages: [python]
    severity: ERROR
  # ══════════════════════════════════════════════════════════════════════════
  # ⛔ REGLE DESACTIVEE — ARBITRAGE DU 2026-09-04, ET LA RAISON EST ICI
  #
  # `rw-shell-fstring-execute-as-root` : interpolation dans une commande shell
  # executee en root.
  #
  # Le motif d'origine NE COMPILAIT PAS (`f"...{$VAR}..."` — semgrep ne
  # substitue pas de metavariable dans un champ de remplacement de f-string).
  # Il a ete repare, puis SIMULE par AST sur `backend/` : **84 occurrences**,
  # dont `f'systemctl start {service}'` et `f'touch {path} && chmod 640 {path}'`.
  #
  # **Quasi toutes interpolent une valeur DEJA VALIDEE en amont**
  # (`_validate_service_name`, `_valid_username`, un chemin litteral).
  # « Y a-t-il une interpolation ? » n'est pas « la valeur est-elle sure ? », et
  # l'idiome NORMAL de ce depot est l'interpolation validee.
  #
  # ⚠ UNE REGLE QUI COMPILE ET TROUVE **TOUT** EST AUSSI INUTILE QU'UNE QUI NE
  # TROUVE RIEN — et elle redevient du decor PLUS VITE, parce que 84 lignes
  # rouges se scrollent alors qu'une erreur de compilation se lit.
  #
  # La propriete visee est un flux SOURCE -> SINK : elle demande `mode: taint`,
  # que personne ne peut valider ici (semgrep absent de l'hote et des trois
  # conteneurs). **Activer sur la foi d'un mode non valide serait pire que
  # laisser la regle desactivee et DITE.**
  #
  # ⚠ POURQUOI COMMENTEE ET NON RETROGRADEE EN `WARNING` : le job filtre par
  # `--severity=ERROR`, et ce filtre est en cours de RETRAIT. Une desactivation
  # qui reposerait sur la severite serait donc annulee en silence par ce
  # retrait. **Une desactivation doit survivre au changement de la commande.**
  #
  # Le motif REPARE est conserve ci-dessous, en commentaire, pour qu'une
  # reactivation ne reparte pas du motif casse.
  # ══════════════════════════════════════════════════════════════════════════

  #   - id: rw-shell-fstring-execute-as-root
  #     # ⚠ REECRIT — les trois motifs precedents ne compilaient pas.
  #     #
  #     # `f"...{$VAR}..."` n'est pas du Python valide : mesure par le parseur de
  #     # Python lui-meme, « f-string: expecting a valid expression after '{' ».
  #     # Semgrep ne substitue pas de metavariable dans le champ de remplacement
  #     # d'une f-string ; le motif doit donc y etre valide TEL QUEL, et il ne
  #     # l'etait pas. La regle n'a jamais compile, donc jamais rien garde.
  #     #
  #     # On sort la metavariable de la f-string : elle capture l'ARGUMENT entier,
  #     # et le filtrage se fait par expression reguliere sur son texte source.
  #     #
  #     # ⚠⚠ NE PAS ACTIVER EN L'ETAT — SIMULATION DU 2026-09-04.
  #     # La logique de ce motif, simulee par AST sur `backend/`, rend **84
  #     # occurrences** : `f'systemctl start {service}'`, `f'touch {path} && chmod
  #     # 640 {path}'`, `f'journalctl -u {service} …'`. Quasi toutes interpolent une
  #     # valeur DEJA VALIDEE en amont (`_validate_service_name`, `_valid_username`).
  #     # « Y a-t-il une interpolation ? » n'est pas « la valeur est-elle sure ? », et
  #     # l'idiome NORMAL de ce depot est l'interpolation validee. Le motif rendrait
  #     # le job rouge en permanence avec 84 faux positifs : c'est le MIROIR du
  #     # defaut qu'on repare, et une regle qui trouve TOUT redevient du decor plus
  #     # vite qu'une qui ne trouve rien. La propriete visee est un flux
  #     # SOURCE -> SINK : elle demande `mode: taint`, non validable ici (semgrep
  #     # absent de l'hote et des trois conteneurs). Reparation syntaxique conservee
  #     # pour que le fichier compile ; l'ACTIVATION est un arbitrage.
  #     patterns:
  #       - pattern: execute_as_root($CLIENT, $CMD, ...)
  #       - metavariable-regex:
  #           metavariable: $CMD
  #           regex: '^f.*\{.*\}'
  #       - pattern-not-regex: '(shlex\.quote|base64)'
  #     message: |
  #       Interpolation de variable dans commande shell sans shlex.quote.
  #       Utiliser shlex.quote($VAR) ou pousser via base64 -d.
  #       Voir CONTRIBUTING-SECURITY.md section 3.
  #     languages: [python]
  #     severity: ERROR
  #
  - id: rw-subprocess-shell-true
    patterns:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern-not: subprocess.run([...], ...)
    message: |
      subprocess avec shell=True + string interpolee = risque d'injection.
      Passer une liste d'arguments : subprocess.run(['cmd', arg1, arg2]).
    languages: [python]
    severity: WARNING

  # -------------------------------------------------------------------------
  # A02 Crypto - errors='ignore' interdit sur decode
  # -------------------------------------------------------------------------
  - id: rw-decode-errors-ignore
    pattern: $X.decode('utf-8', errors='ignore')
    message: |
      decode('utf-8', errors='ignore') sur un dechiffrement = padding oracle
      + retour silencieux de garbage. Utiliser decode strict ; lever en cas
      d'echec, ne pas masquer. Voir CONTRIBUTING-SECURITY.md section 2.
    languages: [python]
    severity: ERROR

  # -------------------------------------------------------------------------
  # A07 Auth - hash_equals obligatoire pour comparer hash/token PHP
  # -------------------------------------------------------------------------
  - id: rw-php-equals-on-hash
    patterns:
      - pattern-either:
          - pattern: $X === $Y
          - pattern: $X == $Y
      - metavariable-regex:
          metavariable: $X
          regex: '.*(token|hash|csrf|api_key).*'
      # Exclure les comparaisons entre 2 valeurs derivees localement
      # (ex: $session_hash === hash('sha256', $code . $step)) qui ne sont
      # pas vulnerables au timing puisque les deux cotes viennent du serveur.
      - pattern-not: $X === $_SESSION[...]
      - pattern-not: $_SESSION[...] === $X
    message: |
      Comparaison de token/hash/csrf avec == ou === = timing attack potentielle.
      Utiliser hash_equals($a, $b) pour comparaison constant-time.
      Si la comparaison est legitime (deux valeurs serveur-side), ajouter en
      commentaire : // nosemgrep: rw-php-equals-on-hash
    languages: [php]
    severity: WARNING

  # -------------------------------------------------------------------------
  # A07 Auth - random_int / random_bytes pour token securite
  # -------------------------------------------------------------------------
  - id: rw-php-weak-random
    pattern-either:
      - pattern: rand()
      - pattern: mt_rand(...)
    message: |
      rand()/mt_rand() ne sont PAS cryptographiquement surs.
      Pour un token/secret : random_bytes(32) puis bin2hex().
    languages: [php]
    severity: WARNING

  # -------------------------------------------------------------------------
  # A03 XSS PHP - echo direct sans htmlspecialchars
  # -------------------------------------------------------------------------
  - id: rw-php-echo-unescaped-var
    patterns:
      # ⚠ REECRIT — la branche `<?= $X ?>` ne compilait pas.
      #
      # `<?= ... ?>` sont des BALISES d'ouverture/fermeture, pas un fragment de
      # code : mesure par `php -l`, « Errors parsing », la ou `echo $X;` rend
      # « No syntax errors detected ». Un motif est une expression ou une
      # instruction, jamais un document avec ses delimiteurs.
      #
      # La branche est RETIREE, non reparee : le parseur PHP de semgrep
      # normalise `<?= $x ?>` en instruction `echo`, donc `echo $X;` couvre les
      # deux formes. ⚠ CETTE EQUIVALENCE N'EST PAS VERIFIEE ICI — elle demande
      # une execution de semgrep.
      #
      # ✅ SIMULATION DU 2026-09-04 : **0 occurrence** dans `legacy/`, sous les
      # deux formes. Seule des trois livrable sans arbitrage — aucun bruit, et
      # son role est de rougir le jour ou une occurrence apparait. ⚠ Corollaire :
      # zero occurrence signifie qu'aucun temoin POSITIF ne peut etre tire du
      # depot ; prouver qu'elle MORD demande un fichier d'epreuve dedie.
      - pattern: echo $X;
      - metavariable-regex:
          metavariable: $X
          regex: '\$_(GET|POST|REQUEST|COOKIE)\[.*\]'
    message: |
      echo direct d'une variable user-controlled sans htmlspecialchars.
      Utiliser : <?= htmlspecialchars($var, ENT_QUOTES, 'UTF-8') ?>
    languages: [php]
    severity: ERROR

  # -------------------------------------------------------------------------
  # A05 Misconfig - pas de var_dump / print_r en prod
  # -------------------------------------------------------------------------
  - id: rw-php-debug-leak
    pattern-either:
      - pattern: var_dump(...)
      - pattern: print_r($X);
      - pattern: error_reporting(E_ALL)
    message: |
      Debug output detecte. Retirer avant commit, sinon stack trace / data
      leak en prod.
    languages: [php]
    severity: WARNING
  # ══════════════════════════════════════════════════════════════════════════
  # ⛔ REGLE RETIREE — CONVERTIE EN INVARIANT AST, ARBITRAGE DU 2026-09-04
  #
  # `rw-flask-route-without-api-key` : route Flask sans `@require_api_key`.
  #
  # **La propriete est VRAIE et vaut d'etre gardee. C'est l'INSTRUMENT qui
  # etait faux.** Deux fois :
  #
  #   1. le motif ne compilait pas — un `...` SEUL entre deux decorateurs et le
  #      `def`, position ou Python n'admet que des lignes commencant par `@` ;
  #   2. repare, la simulation rend **3 occurrences sur 230**, et **les trois
  #      sont des exceptions LEGITIMES documentees a leur site** :
  #        updates.py:update_security_exec  jeton HMAC X-Update-Token, borne au
  #                                         machine_id, signe avec SECRET_KEY
  #        chatops.py:chatops_command       signature Slack OU jeton partage
  #        monitoring.py:test               sonde de vie, chaine statique
  #      -> **3 faux positifs PERMANENTS.**
  #
  # Un moteur de motifs ne sait pas porter une liste d'exceptions ARGUMENTEES,
  # ni n'asserter que l'ECART a un etat connu. Un invariant sur l'arbre
  # syntaxique le sait, et ce depot en possede deja un qui marche.
  #
  # ✅ REMPLACEE PAR : `backend/tests/test_invariant_cle_api.py`
  #    (gabarit : `test_invariant_machine_id.py`, plancher compris)
  # ══════════════════════════════════════════════════════════════════════════

  - id: rw-aes-cbc-encrypt
    patterns:
      - pattern: openssl_encrypt($DATA, 'AES-256-CBC', ...)
    paths:
      # migrate_crypto.php est par design un re-encrypt CBC->AEAD pour les
      # vieilles donnees. Toleré le temps de la migration complete.
      exclude:
        - 'legacy/auth/migrate_crypto.php'
    message: |
      AES-CBC sans MAC = malleable (bit-flipping). Utiliser AES-GCM (AEAD) :
      openssl_encrypt($data, 'aes-256-gcm', $key, OPENSSL_RAW_DATA, $iv, $tag)
      ou libsodium sodium_crypto_secretbox().
      Si vraiment necessaire (migration legacy), ajouter // nosemgrep et un
      commentaire qui motive la conservation du CBC.
    languages: [php]
    severity: ERROR
