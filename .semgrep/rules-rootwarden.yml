# Règles Semgrep custom RootWarden - dérivées de CONTRIBUTING-SECURITY.md
# Issues de l'audit OWASP Top 10 du 2026-05-19.
# Lancement local : semgrep --config .semgrep/rules-rootwarden.yml .
# CI : intégré dans .github/workflows/ci.yml semgrep step (bloquant sur main).

rules:
  # -------------------------------------------------------------------------
  # A03 Injection SQL - placeholders obligatoires
  # -------------------------------------------------------------------------
  - id: rw-sql-fstring-execute
    pattern-either:
      - pattern: $CUR.execute(f"...")
      - pattern: $CUR.execute("..." % $X)
      - pattern: $CUR.execute("...".format(...))
    message: |
      Construction de requete SQL par interpolation. Utiliser placeholders %s :
        cur.execute("SELECT ... WHERE id = %s", (id,))
      Voir CONTRIBUTING-SECURITY.md section 3.
    languages: [python]
    severity: ERROR

  # -------------------------------------------------------------------------
  # A03 Injection commande - shlex.quote obligatoire pour interpolation shell
  # -------------------------------------------------------------------------
  - id: rw-shell-fstring-execute-as-root
    patterns:
      - pattern: execute_as_root($CLIENT, f"...{$VAR}...", ...)
      # ⚠ CETTE EXEMPTION NE FONCTIONNAIT PAS, ET PERSONNE NE POUVAIT LE SAVOIR.
      # Elle etait ecrite `f"...{shlex.quote($VAR)}..."` — une forme AST. La regle
      # n'ayant jamais compile (cf. le `pattern-not` base64 ci-dessous), elle n'a
      # jamais tourne : son exemption n'avait donc jamais ete eprouvee.
      #
      # Le temoin negatif de `ci.yml` l'a mesuree des la premiere execution : sur
      # deux appels GARDES, seul celui a `shlex.quote` a mordu — celui passant par
      # `base64 -d`, exempte par un `pattern-not-regex`, ne mordait pas.
      # **La regle aurait donc accuse TOUT appel correctement echappe.** Une regle
      # qui accuse a tort s'use plus vite qu'une regle absente : celui qui sait son
      # code bon apprend que le garde se trompe, donc a passer outre.
      - pattern-not-regex: 'shlex\.quote'
      # ⚠ CETTE EXEMPTION ETAIT `f"...{base64...}..."`, ET LA REGLE ENTIERE NE
      # COMPILAIT PAS : `base64...` n'est pas une expression Python. Une regle qui
      # ne compile pas rend ZERO trouvaille, et zero se lit « propre » — la regle
      # visant l'injection shell en root n'a donc jamais tourne.
      # `pattern-not-regex` porte la meme intention (« sauf si la charge est
      # poussee par base64 -d ») et compile toujours.
      - pattern-not-regex: 'base64\s+-d'
    message: |
      Interpolation de variable dans commande shell sans shlex.quote.
      Utiliser shlex.quote($VAR) ou pousser via base64 -d.
      Voir CONTRIBUTING-SECURITY.md section 3.
    languages: [python]
    severity: ERROR

  - id: rw-subprocess-shell-true
    patterns:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern-not: subprocess.run([...], ...)
    message: |
      subprocess avec shell=True + string interpolee = risque d'injection.
      Passer une liste d'arguments : subprocess.run(['cmd', arg1, arg2]).
    languages: [python]
    severity: WARNING

  # -------------------------------------------------------------------------
  # A02 Crypto - errors='ignore' interdit sur decode
  # -------------------------------------------------------------------------
  - id: rw-decode-errors-ignore
    pattern: $X.decode('utf-8', errors='ignore')
    message: |
      decode('utf-8', errors='ignore') sur un dechiffrement = padding oracle
      + retour silencieux de garbage. Utiliser decode strict ; lever en cas
      d'echec, ne pas masquer. Voir CONTRIBUTING-SECURITY.md section 2.
    languages: [python]
    severity: ERROR

  # -------------------------------------------------------------------------
  # A07 Auth - hash_equals obligatoire pour comparer hash/token PHP
  # -------------------------------------------------------------------------
  - id: rw-php-equals-on-hash
    patterns:
      - pattern-either:
          - pattern: $X === $Y
          - pattern: $X == $Y
          # ⚠ LES FORMES NEGATIVES MANQUAIENT, ET C'ETAIT LA MOITIE DU DOMAINE.
          #    `laravel/app/Services/JournalAudit.php:192` porte
          #    `$l->prev_hash !== $tete` — une comparaison de hachage que cette
          #    regle ne voyait pas. Une regle qui ne couvre que `===` laisse
          #    passer tout ce qui s'ecrit « si ca NE correspond PAS », et c'est
          #    la forme la plus naturelle d'une verification.
          - pattern: $X !== $Y
          - pattern: $X != $Y
      - metavariable-regex:
          metavariable: $X
          regex: '.*(token|hash|csrf|api_key).*'
      # Exclure les comparaisons entre 2 valeurs derivees localement
      # (ex: $session_hash === hash('sha256', $code . $step)) qui ne sont
      # pas vulnerables au timing puisque les deux cotes viennent du serveur.
      - pattern-not: $X === $_SESSION[...]
      - pattern-not: $_SESSION[...] === $X
      # ⚠ UN TEST DE NULLITE N'EST PAS UNE COMPARAISON DE HACHAGE.
      #    `JournalAudit.php:178` porte `if ($l->self_hash === null)`. La regle
      #    l'accusait parce que le NOM de la variable contient « hash » — elle
      #    apparie le nom, pas la nature de l'operande droite. Il n'y a aucune
      #    fuite de temps a comparer a `null` : la valeur secrete n'est pas du
      #    cote droit, il n'y a pas de valeur du tout.
      - pattern-not: $X === null
      - pattern-not: $X !== null
      - pattern-not: $X == null
      - pattern-not: $X != null
    message: |
      Comparaison de token/hash/csrf avec == ou === = timing attack potentielle.
      Utiliser hash_equals($a, $b) pour comparaison constant-time.
      Si la comparaison est legitime (deux valeurs serveur-side), ajouter en
      commentaire : // nosemgrep: rw-php-equals-on-hash
    languages: [php]
    severity: WARNING

  # -------------------------------------------------------------------------
  # A07 Auth - random_int / random_bytes pour token securite
  # -------------------------------------------------------------------------
  - id: rw-php-weak-random
    pattern-either:
      - pattern: rand()
      - pattern: mt_rand(...)
    message: |
      rand()/mt_rand() ne sont PAS cryptographiquement surs.
      Pour un token/secret : random_bytes(32) puis bin2hex().
    languages: [php]
    severity: WARNING

  # -------------------------------------------------------------------------
  # A03 XSS PHP - echo direct sans htmlspecialchars
  # -------------------------------------------------------------------------
  - id: rw-php-echo-unescaped-var
    patterns:
      - pattern-either:
          - pattern: echo $X;
          # ⚠ IL Y AVAIT ICI `- pattern: <?= $X ?>`, ET LA REGLE NE COMPILAIT PAS :
          # une balise PHP n'est pas un motif. Retire plutot que reecrit, parce que
          # l'analyseur normalise l'echo court en instruction `echo` — `echo $X;`
          # devrait donc couvrir les deux formes. **C'est une attente, pas une
          # mesure** : le pas de temoin de `ci.yml` la met a l'epreuve sur un
          # `<?= $_GET[...] ?>` forge, et sa sortie tranchera.
      - metavariable-regex:
          metavariable: $X
          regex: '\$_(GET|POST|REQUEST|COOKIE)\[.*\]'
    message: |
      echo direct d'une variable user-controlled sans htmlspecialchars.
      Utiliser : <?= htmlspecialchars($var, ENT_QUOTES, 'UTF-8') ?>
    languages: [php]
    severity: ERROR

  # -------------------------------------------------------------------------
  # A05 Misconfig - pas de var_dump / print_r en prod
  # -------------------------------------------------------------------------
  - id: rw-php-debug-leak
    pattern-either:
      - pattern: var_dump(...)
      - pattern: print_r($X);
      - pattern: error_reporting(E_ALL)
    message: |
      Debug output detecte. Retirer avant commit, sinon stack trace / data
      leak en prod.
    languages: [php]
    severity: WARNING

  # -------------------------------------------------------------------------
  # A04 Auth - require_api_key obligatoire sur les blueprints sensibles
  # -------------------------------------------------------------------------
  - id: rw-flask-route-without-api-key
      # ⚠ LES DEUX `pattern-not` PORTAIENT UN `...` NU ENTRE DEUX DECORATEURS, ce
      # qui ne compile pas : la regle qui verifie qu'une route Flask porte
      # `@require_api_key` n'a donc jamais tourne. Le `...` du CORPS reste, lui est
      # valide. Consequence assumee : les deux exemptions exigent maintenant le
      # decorateur ADJACENT a `@bp.route`. Un decorateur intercale ferait rougir a
      # tort — le pas de temoin de `ci.yml` mesure les deux ordres.
    patterns:
      - pattern: |
          @bp.route(...)
          def $F(...):
            ...
      - pattern-not: |
          @bp.route(...)
          @require_api_key
          def $F(...):
            ...
      - pattern-not: |
          @require_api_key
          @bp.route(...)
          def $F(...):
            ...
    message: |
      Route Flask sans @require_api_key. Toute route doit etre authentifiee
      sauf cas explicite documente. Voir CONTRIBUTING-SECURITY.md section 1.
    languages: [python]
    severity: ERROR

  # -------------------------------------------------------------------------
  # A02 Crypto - pas d'AES-CBC en ecriture (uniquement lecture legacy autorisee)
  # -------------------------------------------------------------------------
  - id: rw-aes-cbc-encrypt
    patterns:
      - pattern: openssl_encrypt($DATA, 'AES-256-CBC', ...)
    paths:
      # migrate_crypto.php est par design un re-encrypt CBC->AEAD pour les
      # vieilles donnees. Toleré le temps de la migration complete.
      exclude:
        # E-404 : le fichier a ete DEPLACE hors du legacy (`scripts/`) pour
        # survivre a l'extinction du portail. Ce chemin est EN DUR : sans
        # cette mise a jour, la regle se remettait a mordre sur un fichier
        # legitime des le deplacement — la regle a toujours un objet, le
        # `openssl_encrypt(..., 'AES-256-CBC', ...)` est encore la (l.187).
        - 'scripts/migrate_crypto.php'
    message: |
      AES-CBC sans MAC = malleable (bit-flipping). Utiliser AES-GCM (AEAD) :
      openssl_encrypt($data, 'aes-256-gcm', $key, OPENSSL_RAW_DATA, $iv, $tag)
      ou libsodium sodium_crypto_secretbox().
      Si vraiment necessaire (migration legacy), ajouter // nosemgrep et un
      commentaire qui motive la conservation du CBC.
    languages: [php]
    severity: ERROR
