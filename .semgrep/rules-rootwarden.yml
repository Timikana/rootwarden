# Règles Semgrep custom RootWarden - dérivées de CONTRIBUTING-SECURITY.md
# Issues de l'audit OWASP Top 10 du 2026-05-19.
# Lancement local : semgrep --config .semgrep/rules-rootwarden.yml .
# CI : intégré dans .github/workflows/ci.yml semgrep step (bloquant sur main).

rules:
  # -------------------------------------------------------------------------
  # A03 Injection SQL - placeholders obligatoires
  # -------------------------------------------------------------------------
  - id: rw-sql-fstring-execute
    pattern-either:
      - pattern: $CUR.execute(f"...")
      - pattern: $CUR.execute("..." % $X)
      - pattern: $CUR.execute("...".format(...))
    message: |
      Construction de requete SQL par interpolation. Utiliser placeholders %s :
        cur.execute("SELECT ... WHERE id = %s", (id,))
      Voir CONTRIBUTING-SECURITY.md section 3.
    languages: [python]
    severity: ERROR

  # -------------------------------------------------------------------------
  # A03 Injection commande - shlex.quote obligatoire pour interpolation shell
  # -------------------------------------------------------------------------
  - id: rw-shell-fstring-execute-as-root
    # ⚠ REECRIT — les trois motifs precedents ne compilaient pas.
    #
    # `f"...{$VAR}..."` n'est pas du Python valide : mesure par le parseur de
    # Python lui-meme, « f-string: expecting a valid expression after '{' ».
    # Semgrep ne substitue pas de metavariable dans le champ de remplacement
    # d'une f-string ; le motif doit donc y etre valide TEL QUEL, et il ne
    # l'etait pas. La regle n'a jamais compile, donc jamais rien garde.
    #
    # On sort la metavariable de la f-string : elle capture l'ARGUMENT entier,
    # et le filtrage se fait par expression reguliere sur son texte source.
    patterns:
      - pattern: execute_as_root($CLIENT, $CMD, ...)
      - metavariable-regex:
          metavariable: $CMD
          regex: '^f.*\{.*\}'
      - pattern-not-regex: '(shlex\.quote|base64)'
    message: |
      Interpolation de variable dans commande shell sans shlex.quote.
      Utiliser shlex.quote($VAR) ou pousser via base64 -d.
      Voir CONTRIBUTING-SECURITY.md section 3.
    languages: [python]
    severity: ERROR

  - id: rw-subprocess-shell-true
    patterns:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern-not: subprocess.run([...], ...)
    message: |
      subprocess avec shell=True + string interpolee = risque d'injection.
      Passer une liste d'arguments : subprocess.run(['cmd', arg1, arg2]).
    languages: [python]
    severity: WARNING

  # -------------------------------------------------------------------------
  # A02 Crypto - errors='ignore' interdit sur decode
  # -------------------------------------------------------------------------
  - id: rw-decode-errors-ignore
    pattern: $X.decode('utf-8', errors='ignore')
    message: |
      decode('utf-8', errors='ignore') sur un dechiffrement = padding oracle
      + retour silencieux de garbage. Utiliser decode strict ; lever en cas
      d'echec, ne pas masquer. Voir CONTRIBUTING-SECURITY.md section 2.
    languages: [python]
    severity: ERROR

  # -------------------------------------------------------------------------
  # A07 Auth - hash_equals obligatoire pour comparer hash/token PHP
  # -------------------------------------------------------------------------
  - id: rw-php-equals-on-hash
    patterns:
      - pattern-either:
          - pattern: $X === $Y
          - pattern: $X == $Y
      - metavariable-regex:
          metavariable: $X
          regex: '.*(token|hash|csrf|api_key).*'
      # Exclure les comparaisons entre 2 valeurs derivees localement
      # (ex: $session_hash === hash('sha256', $code . $step)) qui ne sont
      # pas vulnerables au timing puisque les deux cotes viennent du serveur.
      - pattern-not: $X === $_SESSION[...]
      - pattern-not: $_SESSION[...] === $X
    message: |
      Comparaison de token/hash/csrf avec == ou === = timing attack potentielle.
      Utiliser hash_equals($a, $b) pour comparaison constant-time.
      Si la comparaison est legitime (deux valeurs serveur-side), ajouter en
      commentaire : // nosemgrep: rw-php-equals-on-hash
    languages: [php]
    severity: WARNING

  # -------------------------------------------------------------------------
  # A07 Auth - random_int / random_bytes pour token securite
  # -------------------------------------------------------------------------
  - id: rw-php-weak-random
    pattern-either:
      - pattern: rand()
      - pattern: mt_rand(...)
    message: |
      rand()/mt_rand() ne sont PAS cryptographiquement surs.
      Pour un token/secret : random_bytes(32) puis bin2hex().
    languages: [php]
    severity: WARNING

  # -------------------------------------------------------------------------
  # A03 XSS PHP - echo direct sans htmlspecialchars
  # -------------------------------------------------------------------------
  - id: rw-php-echo-unescaped-var
    patterns:
      # ⚠ REECRIT — la branche `<?= $X ?>` ne compilait pas.
      #
      # `<?= ... ?>` sont des BALISES d'ouverture/fermeture, pas un fragment de
      # code : mesure par `php -l`, « Errors parsing », la ou `echo $X;` rend
      # « No syntax errors detected ». Un motif est une expression ou une
      # instruction, jamais un document avec ses delimiteurs.
      #
      # La branche est RETIREE, non reparee : le parseur PHP de semgrep
      # normalise `<?= $x ?>` en instruction `echo`, donc `echo $X;` couvre les
      # deux formes. ⚠ CETTE EQUIVALENCE N'EST PAS VERIFIEE ICI — elle demande
      # une execution de semgrep.
      - pattern: echo $X;
      - metavariable-regex:
          metavariable: $X
          regex: '\$_(GET|POST|REQUEST|COOKIE)\[.*\]'
    message: |
      echo direct d'une variable user-controlled sans htmlspecialchars.
      Utiliser : <?= htmlspecialchars($var, ENT_QUOTES, 'UTF-8') ?>
    languages: [php]
    severity: ERROR

  # -------------------------------------------------------------------------
  # A05 Misconfig - pas de var_dump / print_r en prod
  # -------------------------------------------------------------------------
  - id: rw-php-debug-leak
    pattern-either:
      - pattern: var_dump(...)
      - pattern: print_r($X);
      - pattern: error_reporting(E_ALL)
    message: |
      Debug output detecte. Retirer avant commit, sinon stack trace / data
      leak en prod.
    languages: [php]
    severity: WARNING

  # -------------------------------------------------------------------------
  # A04 Auth - require_api_key obligatoire sur les blueprints sensibles
  # -------------------------------------------------------------------------
  - id: rw-flask-route-without-api-key
    # ⚠ REECRIT, ET SA SEMANTIQUE RESTE NON VERIFIEE.
    #
    # Les deux `pattern-not` precedents portaient un `...` SEUL entre deux
    # decorateurs et le `def`. Python n'admet a cet endroit que des lignes
    # commencant par `@` : mesure par `ast.parse`, « invalid syntax » ligne 3.
    # L'ellipse de semgrep ne franchit pas cette position.
    #
    # ⚠ CE QUE CETTE REECRITURE NE PROUVE PAS. Elle rend le motif
    # syntaxiquement valide ; elle ne prouve PAS que semgrep exprime
    # correctement « ce decorateur est ABSENT ». Cette famille de propriete est
    # mal servie par un moteur de motifs, et elle est deja mesuree de facon
    # FIABLE dans ce depot par un invariant sur l'arbre syntaxique
    # (`backend/tests/test_invariant_machine_id.py`, qui compte 230 routes et
    # 116 gardes). RECOMMANDATION : deplacer cette regle vers un invariant du
    # meme modele, et la retirer d'ici.
    patterns:
      - pattern: |
          @bp.route(...)
          def $F(...):
            ...
      - pattern-not: |
          @require_api_key
          def $F(...):
            ...
    message: |
      Route Flask sans @require_api_key. Toute route doit etre authentifiee
      sauf cas explicite documente. Voir CONTRIBUTING-SECURITY.md section 1.
    languages: [python]
    severity: ERROR

  # -------------------------------------------------------------------------
  # A02 Crypto - pas d'AES-CBC en ecriture (uniquement lecture legacy autorisee)
  # -------------------------------------------------------------------------
  - id: rw-aes-cbc-encrypt
    patterns:
      - pattern: openssl_encrypt($DATA, 'AES-256-CBC', ...)
    paths:
      # migrate_crypto.php est par design un re-encrypt CBC->AEAD pour les
      # vieilles donnees. Toleré le temps de la migration complete.
      exclude:
        - 'legacy/auth/migrate_crypto.php'
    message: |
      AES-CBC sans MAC = malleable (bit-flipping). Utiliser AES-GCM (AEAD) :
      openssl_encrypt($data, 'aes-256-gcm', $key, OPENSSL_RAW_DATA, $iv, $tag)
      ou libsodium sodium_crypto_secretbox().
      Si vraiment necessaire (migration legacy), ajouter // nosemgrep et un
      commentaire qui motive la conservation du CBC.
    languages: [php]
    severity: ERROR
