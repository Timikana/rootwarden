# ================================================================
# docker-compose.prod.yml - durcissement des conteneurs en production
#
# Applique par `./maj.sh` et `./start.sh` quand `COMPOSE_DURCI=true` dans
# srv-docker.env (audit 2026-10-13, H-4). Manuellement :
#   docker compose --env-file srv-docker.env -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ── CE FICHIER NE DEMARRAIT PAS, ET RIEN NE L'APPELAIT ─────────────────────
#
# Mesure du 2026-10-13, stack complete lancee avec cet overlay (projet compose
# isole, base vide) — les DEUX services applicatifs redemarraient en boucle :
#   laravel  « cannot create /etc/apache2/sites-available/000-default.conf:
#             Read-only file system » : l'entrypoint ecrit le vhost TLS dans
#             /etc, rendu en lecture seule par `read_only: true` ;
#   python   « failed switching to "rootwarden": operation not permitted » :
#             `cap_drop: ALL` retirait SETUID/SETGID, dont `gosu` a besoin.
# Aucun script ne l'incluant, personne ne l'avait vu. Le brancher tel quel
# aurait mis la production hors service.
#
# ⚠ ET SON EN-TETE MENTAIT : il disait RETIRER les montages `./backend:/app`.
# Une surcharge compose ne retire pas un montage du fichier de base, elle s'y
# ajoute — verifie sur le conteneur : `./backend -> /app` reste monte. C'est
# d'ailleurs voulu ici : `./maj.sh` met le code a jour par `git pull`.
#
# ── CE QUI EST APPLIQUE ───────────────────────────────────────────────────
#   python  read_only + tmpfs, cap_drop ALL + le strict necessaire a
#           l'entrypoint (chown/chmod en root, puis gosu vers rootwarden)
#   db      cap_drop ALL + le necessaire a MySQL
#   laravel cap_drop ALL + le necessaire a Apache — SANS read_only : le code est
#           monte en ECRITURE (./laravel), donc un systeme racine en lecture
#           seule protege peu, et ses tmpfs (sessions, vues) deconnectaient tout
#           le monde a chaque redemarrage.
#   no-new-privileges : deja pose par docker-compose.yml sur les trois.
# ================================================================

services:
  python:
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /var/run:size=8M
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # entrypoint : chown des logs, du certificat backend
      - DAC_OVERRIDE   # entrypoint : chmod sur des fichiers d'autres proprietaires
      - FOWNER
      - SETUID         # gosu rootwarden
      - SETGID

  db:
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  laravel:
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # Apache ecoute 80/443
      - CHOWN              # entrypoint : chown storage, bootstrap/cache, .env
      - SETUID             # Apache passe en www-data
      - SETGID
      - DAC_OVERRIDE       # Apache lit /etc/apache2/* apres passage en www-data
      - FOWNER             # entrypoint : chmod 640 sur .env
