{{- if .Values.networkPolicy.enabled }}
# La base n'accepte que le portail et le backend, comme le reseau `internal`
# de Docker Compose. Le backend garde sa sortie libre (SSH vers le parc).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rootwarden-db
  labels:
    {{- include "rw.etiquettes" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rw.selecteur" (dict "root" . "composant" "db") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rw.selecteur" (dict "root" . "composant" "python") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "rw.selecteur" (dict "root" . "composant" "laravel") | nindent 14 }}
      ports:
        - port: 3306
---
# Le backend n'accepte que le portail.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rootwarden-python
  labels:
    {{- include "rw.etiquettes" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rw.selecteur" (dict "root" . "composant" "python") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rw.selecteur" (dict "root" . "composant" "laravel") | nindent 14 }}
      ports:
        - port: 5000
{{- end }}
