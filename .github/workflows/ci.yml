# ================================================================
# RootWarden CI/CD Pipeline
# ================================================================
# Declencheurs : push sur main, pull requests vers main
# Etapes : lint Python + PHP, tests pytest, build Docker images
# ================================================================

name: RootWarden CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Patch A08 : least-privilege par defaut pour GITHUB_TOKEN. Sans bloc global,
# le token herite des permissions par defaut du repo (potentiellement write) ->
# surface d'abus si une action est compromise. Les jobs qui ont besoin de plus
# (auto-tag : contents: write) le declarent explicitement.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/rootwarden

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1 : Lint Python (ruff - plus rapide que flake8)
  # ─────────────────────────────────────────────────────────────
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check backend/ || true
        # Non-bloquant pour l'instant - format progressif

  # ─────────────────────────────────────────────────────────────
  # Job 2 : Lint PHP (php -l - verifie la syntaxe)
  # ─────────────────────────────────────────────────────────────
  lint-php:
    name: Lint PHP (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      # ⚠ CE JOB LINTAIT L'ARCHIVE ET RIEN D'AUTRE.
      #
      # `find legacy/ -name "*.php"` traverse `legacy/_deprecated/`, donc il
      # trouvait 178 fichiers — TOUS ARCHIVES, plus servis, plus charges — et
      # ZERO des 144 `.php` vivants de `laravel/`. Il etait vert parce que du code
      # mort reste syntaxiquement valide.
      #
      # Et trois jobs en DEPENDENT (`test-php`, `build-docker`, `auto-tag`) : une
      # porte qui mesure du code mort en gardait celle qui mesure le vivant.
      #
      # ⛔ Le jour ou `patch 07` emporte l'archive, l'ancienne forme aurait passe
      # au vert SUR UN ENSEMBLE VIDE — un zero qui se lit « propre ».
      #
      # ── CE QUI EST LINTE, ET CE QUI NE L'EST PAS ────────────────────────────
      #
      # Le PHP SIMPLE de `laravel/` : 144 fichiers suivis, 146 vus dans le
      # conteneur, TOUS passent (mesure du 2026-09-08 13:2x, en `www-data`).
      #
      # ⛔ `resources/views/` est EXCLU, et ce n'est pas une commodite : Blade
      # n'est pas du PHP valide, il est COMPILE avant execution. Mesure : 56 des
      # 57 `.blade.php` passent `php -l` par ACCIDENT — un fichier sans balise
      # `<?php` est du HTML inline, donc valide — et le 57e echoue sur un
      # COMMENTAIRE qui cite `@php(`. **`php -l` n'est pas un linter de Blade :
      # il passe incidemment, et il rougit sur un non-defaut.** La syntaxe des
      # vues est couverte en aval, par `test-php`, qui charge l'application.
      #
      # ⛔ `vendor/` est exclu : ce n'est pas notre code.
      - name: PHP syntax check
        run: |
          echo "=== Verification syntaxe PHP ==="
          fichiers=$(
            find laravel/app laravel/config laravel/routes laravel/database \
                 laravel/tests laravel/bootstrap laravel/public \
                 -name "*.php" -type f 2>/dev/null
            find legacy/ -name "*.php" -type f -not -path "legacy/_deprecated/*" 2>/dev/null
          )
          n=$(printf '%s\n' "$fichiers" | grep -c . || true)

          # ⚠ TEMOIN : un ensemble VIDE n'est pas un succes, c'est une mesure
          # qui n'a pas eu lieu. Sans cette garde, un chemin renomme rendrait ce
          # job vert en ne lintant rien.
          if [ "$n" -eq 0 ]; then
            echo "::error::aucun fichier PHP trouve — les chemins ont bouge."
            echo "Ce job ECHOUE plutot que de passer sans avoir mesure."
            exit 1
          fi
          echo "$n fichier(s) a verifier"

          errors=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file"
              errors=$((errors + 1))
            fi
          done < <(printf '%s\n' "$fichiers")
          echo "=== $errors erreur(s) de syntaxe sur $n fichier(s) ==="
          [ $errors -eq 0 ] || exit 1

  # ─────────────────────────────────────────────────────────────
  # Job 3 : Tests pytest (routes API backend) - BLOQUANT
  #
  # Historique : le patch securite A01-01 (v1.21.0) a rendu get_current_user
  # DB-verified, invalidant les tests qui injectaient X-User-Role en header.
  # Repare : conftest.py mocke la DB (MockCursor reconnait les SELECT users/
  # permissions/api_keys) et definit API_KEY_BOOTSTRAP=1. Suite 169/169 verte,
  # sans setup MySQL reel -> job repasse BLOQUANT (#pytest-rewrite-v1.22 clos).
  # ─────────────────────────────────────────────────────────────
  test-python:
    name: Tests pytest
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          API_KEY: test-api-key-for-ci
          API_KEY_BOOTSTRAP: "1"
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=../test-results.xml

      - name: Upload test results
        if: always()
        # ⚠ NON BLOQUANT, ET C'EST MESURE. Ce pas a rendu ROUGE deux fois un job
        #    dont les 686 tests etaient VERTS : `FinalizeArtifact: (403)
        #    Forbidden`, cote infrastructure d'artefacts, pas cote code. Le
        #    2026-09-08, un rejeu du meme SHA sans aucun changement est passe.
        #    Le degat n'est pas l'artefact perdu — c'est qu'un job rouge sur une
        #    suite verte pousse a fusionner sur rouge (ce que j'ai fait une fois)
        #    et fait chercher une panne dans des tests qui passent.
        #    Le VERDICT des tests est le pas precedent ; celui-ci n'est qu'un
        #    depot de commodite (junit xml), il ne garde rien.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24, pinned 2026-06-16)
        with:
          name: test-results
          path: test-results.xml

  # ─────────────────────────────────────────────────────────────
  # Job 3 bis : Tests PHPUnit du portage Laravel - BLOQUANT (INF-001)
  #
  # Pourquoi il existe. Jusqu'ici la CI portait 13 jobs et UN SEUL executait des
  # tests : `test-python`. Les 232 tests du portage ne protegeaient donc que la
  # machine qui les lancait, et les 104 suites E2E restent entierement manuelles.
  # Ce job ferme la premiere moitie du trou, celle qui ne coute rien.
  #
  # Pourquoi il est BLOQUANT. La suite est HERMETIQUE : ni MySQL, ni backend
  # Python, ni navigateur — `phpunit.xml` pointe la base sur un SQLite en
  # memoire. Elle n'a donc aucune raison d'etre plus indulgente que les quatre
  # portes deja bloquantes du depot (bandit, semgrep, pip-audit, gitleaks). Une
  # porte qui ne bloque pas est un rapport, pas une porte.
  #
  # Ce qu'il mesure, et ce qu'il ne mesure pas. Il mesure les GARDES de route —
  # `role:N`, `perm:xxx`, session authentifiee — sur les 85 routes placees
  # derriere la session authentifiee, avec les trois roles. Il ne mesure NI qu'une page autorisee rende son
  # contenu (il faudrait la base du banc et le backend), NI le jeton CSRF : le
  # cadre EXEMPTE les tests (`PreventRequestForgery::runningUnitTests`), donc une
  # assertion CSRF ecrite ici passerait sans rien mesurer. C'est
  # `tests/e2e/go-socle-passerelle.mjs` qui la porte, et elle reste manuelle.
  #
  # En prime, et ce n'etait pas cherche : `lint-php` ne verifie la syntaxe que de
  # `legacy/`. Une erreur de syntaxe dans `laravel/` n'etait vue par aucun job ;
  # elle fait desormais echouer celui-ci.
  # ─────────────────────────────────────────────────────────────
  test-php:
    name: Tests PHPUnit (portage Laravel)
    runs-on: ubuntu-latest
    needs: lint-php
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # Nommees explicitement plutot que laissees au defaut de l'image :
          # `pdo_sqlite` est ce sur quoi la suite entiere repose, et une
          # extension absente se manifesterait par une erreur de connexion
          # obscure plutot que par un message qui la nomme.
          extensions: mbstring, dom, xml, ctype, tokenizer, fileinfo, curl, pdo, pdo_sqlite, sqlite3, bcmath
          tools: composer

      - name: Composer install
        working-directory: laravel
        # `--no-scripts` par coherence avec `sca-php` : on n'execute pas les
        # hooks des paquets. La decouverte de paquets de Laravel n'en souffre
        # pas — `PackageManifest` reconstruit son manifeste a la volee quand le
        # fichier de cache est absent.
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Preparer l'environnement de test
        working-directory: laravel
        # MESURE, PAS PRECAUTION. Sans cle d'application, la suite rend
        # **226 echecs sur 232** : le groupe `web` chiffre les cookies, donc
        # toute requete de test echoue, et seuls les six tests qui n'emettent
        # aucune requete survivent. Mesure le 2026-08-27 en forcant `APP_KEY` a
        # vide dans le conteneur. La cle est jetable et locale au job : elle ne
        # dechiffre rien qui existe ailleurs.
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: php artisan test
        working-directory: laravel
        run: php artisan test

      - name: Epreuve du deriveur de version (INF-004)
        # HERMETIQUE : elle fabrique un depot jetable — avec une FUSION, sans
        # laquelle la propriete d'unicite ne serait pas eprouvee — et n'a donc
        # besoin ni de l'historique de celui-ci, ni du reseau. Elle est ici
        # plutot que dans `auto-tag` parce qu'`auto-tag` ne tourne QUE sur les
        # poussees vers `main` : la regle de version serait alors verifiee apres
        # avoir servi.
        run: ./scripts/version.sh --epreuve

  # ─────────────────────────────────────────────────────────────
  # Job 4 : Build Docker images (sans push - validation only)
  # ─────────────────────────────────────────────────────────────
  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint-python, lint-php, test-python]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ⛔ CE PAS BATISSAIT L'IMAGE MORTE ET LAISSAIT LA VIVANTE SANS COUVERTURE.
      #    Mesure du 2026-09-08, apres `patch 07` :
      #      laravel/Dockerfile   cite 1 fois dans compose, 0 fois dans ce fichier
      #      php/Dockerfile       cite 0 fois dans compose, 2 fois ici
      #    Le service `php` est retire de `compose` ; plus rien ne bâtit son image
      #    hors la CI. Et l'image que les exploitants LANCENT — le portage —
      #    n'etait ni batie ni scannee. `security-scan` (Trivy) scannait donc
      #    `rootwarden-php:scan`, un artefact que personne ne deploie.
      #    « Un outil borne a un perimetre qui se vide ne tombe pas en panne :
      #      il reussit plus vite. »
      - name: Build Laravel/Apache image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./laravel/Dockerfile
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-laravel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Python/Flask image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-python:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Job 4.1 : Gitleaks - detection de secrets commit (API keys, tokens)
  # ─────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history pour scanner tous les commits
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0 (node24, pinned 2026-06-16 ; gratuit pour repo perso, licence requise seulement pour les organisations)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Si le repo n'a pas de config, gitleaks utilise sa baseline par defaut
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Gitleaks — l'ARBRE ENTIER (MESURE, pas encore une porte)
        # POURQUOI CE PAS EXISTE. Le pas precedent ne scanne pas l'arbre : il scanne
        # une PLAGE de commits que `gitleaks-action` derive de l'evenement. La
        # commande relevee dans le run 34201471220 porte `--no-merges
        # --first-parent`. Or tout ce qui entre dans `main` par une fusion est en
        # SECOND parent :
        #
        #     commits non-fusion dans main            1561
        #     vus par --first-parent                   147
        #     donc jamais scannes                     1414   (mesure le 2026-09-08)
        #
        # **Cinq jours de vert ne dedouanaient rien : la porte ne regardait pas.**
        # Le defaut s'est vu au premier `pull_request` ouvert sur ce depot, parce que
        # l'evenement change la plage — pas parce que le code avait change.
        #
        # CE PAS NE REMPLACE PAS LE PRECEDENT. `--no-git` scanne le CONTENU de
        # l'arbre, independamment de tout evenement et de toute plage. Un secret
        # retire de HEAD mais present dans l'historique reste une affaire de
        # ROTATION, que seul le pas d'historique peut voir.
        #
        # ⛔ POURQUOI `continue-on-error` ALORS QUE CE DEPOT DIT « une porte qui ne
        # bloque pas est un rapport, pas une porte » (ci.yml:132). Parce qu'on ne
        # sait pas encore ce qu'un scan d'arbre rend : 37 fichiers de `tests/e2e/`
        # portent un champ `secret:` — des TOTP de comptes `rw-test-*`. Rendre ce
        # pas bloquant avant d'avoir INVENTORIE, c'est arreter les huit sessions sur
        # un compte qu'on n'a pas fait. Ce pas mesure d'abord et son compte decide
        # ensuite. **Cet etat est transitoire, et il l'est PAR ECRIT ici pour ne pas
        # se perimer en silence.**
        continue-on-error: true
        run: |
          set -euo pipefail
          # Le binaire est celui que le pas precedent a installe et mis en cache :
          # aucun telechargement de plus, donc aucune surface d'appro en plus, et la
          # version reste celle que l'action epingle par son SHA.
          BIN=$(command -v gitleaks || true)
          if [ -z "$BIN" ]; then BIN=$(ls -1 /tmp/gitleaks-*/gitleaks 2>/dev/null | head -1 || true); fi
          if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
            echo "::error::binaire gitleaks introuvable — le pas precedent a change de place."
            echo "Ce controle ECHOUE plutot que de passer sans avoir mesure."
            exit 1
          fi
          "$BIN" version
          "$BIN" detect --no-git --source . --config .gitleaks.toml \
            --redact --verbose --exit-code=1

  # ─────────────────────────────────────────────────────────────
  # Job 4.2 : Bandit - SAST Python (SQL inj, shell inj, hardcoded secrets)
  # ─────────────────────────────────────────────────────────────
  sast-python:
    name: SAST Python (bandit)
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run bandit
        working-directory: backend
        # -ll = low severity minimum, -ii = medium confidence minimum
        # Exclut les repertoires de tests (faux-positifs frequents)
        # Bloquant sur PR ET main depuis v1.17.0 (review securite). Allowlist
        # via bandit.yml si bruit, plutot que de laisser passer silencieusement.
        run: bandit -r . -ll -ii -c bandit.yml --exclude ./tests,./__pycache__ --format txt

  # ─────────────────────────────────────────────────────────────
  # Job 4.2.1 : Semgrep - SAST cross-langue (PHP + JS + Python + Docker)
  # Couvre ce que bandit rate : XSS PHP, prototype pollution JS, OWASP Top 10
  # generique. Ruleset auto = config OWASP + CWE par defaut.
  # ─────────────────────────────────────────────────────────────
  sast-semgrep:
    name: SAST cross-langue (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install semgrep
        run: pip install semgrep
      - name: Run semgrep
        # Configs specifiques (--config=auto exige metrics on, on prefere off).
        # p/owasp-top-ten : focus OWASP Top 10. Plus surgical que p/security-audit
        # qui flag des patterns Dockerfile intentionnels (USER root pour Apache:80).
        # Exclusions : 5 regles validees comme FP par audit v1.17.0
        #   - dockerfile missing-user : Apache/sshd ont besoin de root, gosu drop
        #     les privileges au runtime ; Trivy couvre les vraies regressions.
        #   - mode-without-authentication : encryption.py utilise libsodium
        #     SecretBox en preference, AES-CBC est fallback documente.
        #   - tainted-sql-string : `fmt = ','.join(['%s']*len(ids))` est le
        #     pattern recommande pour `IN (...)` ; donnees passees via params.
        #   - echoed-request : echo json_encode(...) est safe (Content-Type JSON).
        # Allowlist additionnelle : .semgrepignore si besoin.
        run: |
          semgrep \
            --config=p/owasp-top-ten \
            --exclude-rule=python.cryptography.security.mode-without-authentication.crypto-mode-without-authentication \
            --exclude-rule=python.flask.security.injection.tainted-sql-string.tainted-sql-string \
            --exclude-rule=php.lang.security.injection.tainted-sql-string.tainted-sql-string \
            --exclude-rule=php.lang.security.injection.echoed-request.echoed-request \
            --exclude-rule=dockerfile.security.missing-user.missing-user \
            --exclude-rule=dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --error --metrics=off --severity=ERROR .

  # ─────────────────────────────────────────────────────────────
  # Job 4.2b : regles custom RootWarden (.semgrep/) - ADVISORY (non bloquant)
  # Introduites en non bloquant car jamais executees en CI auparavant : plusieurs
  # regles ERROR matchent des patterns LEGITIMES (f-string SQL + placeholders,
  # execute_as_root + shlex.quote, /chatops/command authentifie par signature sans
  # api_key) et necessitent un tri (# nosemgrep) avant de pouvoir bloquer.
  # Ce job surface les findings sans casser le pipeline ; a passer bloquant une
  # fois les faux positifs annotes.
  sast-semgrep-custom:
    name: SAST regles custom RootWarden (semgrep, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install semgrep
        run: pip install semgrep
      # ⛔ CE PAS ETAIT ROUGE A CHAQUE EXECUTION, ET C'EST PIRE QU'INUTILE.
      #    `--error` fait sortir semgrep en 1 des qu'il trouve QUELQUE CHOSE,
      #    et le depot en contient 105 (mesure du 2026-09-08 : 6 regles,
      #    370 cibles). Le job portait donc `continue-on-error: true` ET un
      #    rouge permanent : **une porte qui refuse toujours, on cesse de la
      #    regarder.**
      #
      #    C'est un CLIQUET desormais : il echoue si le compte CROIT, signale
      #    quand il baisse, et n'echoue pas sur l'existant. La reference vit
      #    dans `.semgrep/reference-trouvailles.txt`, un fichier SUIVI — toute
      #    variation passe donc par une relecture.
      #
      #    ⚠ CE COMMENTAIRE A DIT LE CONTRAIRE DU CODE, ET SEULE UNE
      #    CONTRE-EPREUVE L'A ATTRAPE. Il portait « PERIMETRE INCHANGE :
      #    --severity=ERROR retenu, donc 6 des 10 regles » — vrai a l'ecriture,
      #    faux dix minutes plus tard quand le filtre a ete retire dans le meme
      #    fichier. Le compte de « severity=ERROR » restait a 2 : une commande
      #    dans l'AUTRE job, et cette prose-ci. J'ai regarde les lignes au lieu
      #    de conclure du nombre.
      #
      #    ETAT REEL : les DIX regles sont evaluees. Reference 106 (105 ERROR +
      #    1 des quatre WARNING).
      #
      #    ⚠ Et « Rules run: 6 » n'a JAMAIS ete la preuve du defaut de
      #    compilation que le job temoin decrit plus bas : 6 est exactement le
      #    nombre de regles ERROR. Il aurait affiche 6 que les regles
      #    compilent ou non. L'inference etait fausse ; la reparation, bonne.
      - name: Run custom rules (.semgrep/rules-rootwarden.yml)
        run: |
          set -o pipefail
          # ⚠ PLUS DE FILTRE DE SEVERITE. Il ecartait quatre regles maison —
          #    rw-subprocess-shell-true, rw-php-equals-on-hash,
          #    rw-php-weak-random, rw-php-debug-leak — qui compilaient, etaient
          #    maintenues, et n'etaient JAMAIS evaluees. Mesure du 2026-09-08 :
          #    elles trouvent 1 chose de plus sur 370 fichiers (105 -> 106).
          #
          #    ⛔ ET LEUR MORDANT N'EST PAS PROUVE. Le job temoin ci-dessous ne
          #    couvre que les TROIS regles reparees ce jour. « 1 trouvaille sur
          #    370 fichiers » se lit « code propre » OU « regle qui ne matche
          #    presque rien », et rien ici ne separe les deux — c'est exactement
          #    le zero que le temoin existe pour refuser. Etendre ses fixtures a
          #    ces quatre regles est un geste distinct, et il reste a faire.
          semgrep --config=.semgrep/rules-rootwarden.yml --metrics=off \
                  --json --quiet . > /tmp/semgrep.json
          n=$(python3 -c "import json;print(len(json.load(open('/tmp/semgrep.json'))['results']))")
          ref=$(tr -dc '0-9' < .semgrep/reference-trouvailles.txt)
          echo "trouvailles : $n   ·   reference : $ref"
          python3 -c "import json,collections;d=json.load(open('/tmp/semgrep.json'));c=collections.Counter(r['check_id'].split('.')[-1] for r in d['results']);[print(f'  {v:>4}  {k}') for k,v in c.most_common()]"
          if [ -z "$ref" ]; then
            echo "::error::.semgrep/reference-trouvailles.txt vide ou illisible — le cliquet ne mesure rien."
            exit 1
          fi
          if [ "$n" -gt "$ref" ]; then
            echo "::error::$n trouvailles contre $ref en reference : le compte a CRU de $((n - ref))."
            exit 1
          fi
          if [ "$n" -lt "$ref" ]; then
            echo "::warning::$n trouvailles contre $ref : descendre la reference a $n."
          fi
          
  # ─────────────────────────────────────────────────────────────
  # Job 4.3 : SCA Python (safety + pip-audit - CVE sur dependencies)
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # Job 4.2.3 : LES REGLES CUSTOM MORDENT-ELLES ?
  #
  # POURQUOI CE JOB EXISTE, ET POURQUOI IL EST SEPARE.
  # Trois des dix regles maison ne compilaient pas (2026-09-08) :
  #   rw-shell-fstring-execute-as-root   `base64...` n'est pas une expression Python
  #   rw-php-echo-unescaped-var          `<?= $X ?>` n'est pas un motif PHP
  #   rw-flask-route-without-api-key     un `...` nu ENTRE deux decorateurs
  # Elles visaient l'injection shell en root, le XSS, et une route Flask sans
  # `@require_api_key`. **Une regle qui ne compile pas rend ZERO trouvaille, et
  # zero se lit « propre ».** Le scan annonçait « Rules run: 6 » pour dix regles
  # declarees, et le job portant `continue-on-error` rendait le rouge muet.
  #
  # Un correctif ne suffit pas : une regle qui COMPILE sans MORDRE rend le meme
  # zero, et personne ne le verrait. Ce job pose donc un temoin a DEUX fixtures :
  #   mord/       DOIT produire une trouvaille par regle reparee
  #   mord-pas/   DOIT produire ZERO — sinon la regle accuse a tort
  # Les deux sens, parce qu'une regle dont seuls les refus sont verts peut
  # refuser tout, et le vert des refus ne le montrerait pas.
  #
  # ⛔ IL EST BLOQUANT, ET C'EST POUR CA QU'IL EST UN JOB A PART : le
  # `continue-on-error` de `sast-custom` est au niveau du JOB, donc un pas ajoute
  # la-bas serait muet lui aussi.
  # ─────────────────────────────────────────────────────────────
  sast-custom-temoin:
    name: Les regles custom MORDENT (temoin forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install semgrep
        run: pip install semgrep

      - name: Forger les deux fixtures
        run: |
          set -euo pipefail
          mkdir -p /tmp/mord /tmp/mord-pas

          # ── CE QUI DOIT MORDRE ────────────────────────────────────────
          cat > /tmp/mord/t.py <<'MSG'
          import shlex

          def nu(client, nom):
              # rw-shell-fstring-execute-as-root : interpolation NUE
              execute_as_root(client, f"id -u {nom}", 30)

          @bp.route('/temoin-sans-garde')
          def temoin_sans_garde():
              # rw-flask-route-without-api-key : aucun decorateur de garde
              return ''
          MSG

          cat > /tmp/mord/t.php <<'MSG'
          <?php
          // rw-php-echo-unescaped-var, forme longue
          echo $_GET['nom'];
          // et la forme COURTE : c'est elle que le correctif SUPPOSE couverte
          ?>
          <?= $_GET['court'] ?>
          MSG

          # ── CE QUI NE DOIT PAS MORDRE ─────────────────────────────────
          cat > /tmp/mord-pas/t.py <<'MSG'
          import shlex

          def quote(client, nom):
              execute_as_root(client, f"id -u {shlex.quote(nom)}", 30)

          def par_base64(client, charge):
              execute_as_root(client, f"printf '%s' '{charge}' | base64 -d | bash", 30)

          @bp.route('/temoin-garde')
          @require_api_key
          def temoin_garde():
              return ''
          MSG

          cat > /tmp/mord-pas/t.php <<'MSG'
          <?php
          echo htmlspecialchars($_GET['nom'], ENT_QUOTES, 'UTF-8');
          MSG

          echo "fixtures : $(ls -1 /tmp/mord /tmp/mord-pas | wc -l) fichiers"

      - name: TEMOIN POSITIF — chaque regle reparee doit MORDRE
        run: |
          set -euo pipefail
          semgrep --config .semgrep/rules-rootwarden.yml --metrics=off \
                  --json --no-git-ignore /tmp/mord > /tmp/mord.json
          echo "── ce que le temoin a trouve ──"
          jq -r '.results[] | "  \(.check_id | split(".") | last)  \(.path):\(.start.line)"' /tmp/mord.json
          echo "── erreurs de compilation de regles (doit etre VIDE) ──"
          jq -r '.errors[]? | "  \(.type // "?")  \(.message // .long_msg // "?")"' /tmp/mord.json | head -20
          test "$(jq '[.errors[]? | select((.type // "") | test("Rule|rule"))] | length' /tmp/mord.json)" -eq 0 \
            || { echo "::error::une regle ne compile toujours pas"; exit 1; }

          manquantes=0
          for r in rw-shell-fstring-execute-as-root rw-flask-route-without-api-key rw-php-echo-unescaped-var; do
            n=$(jq --arg r "$r" '[.results[] | select(.check_id | endswith($r))] | length' /tmp/mord.json)
            printf "  %-36s %s trouvaille(s)\n" "$r" "$n"
            [ "$n" -ge 1 ] || { echo "::error::$r ne MORD PAS — reparee en apparence seulement"; manquantes=$((manquantes+1)); }
          done
          [ "$manquantes" -eq 0 ] || exit 1

          # ⚠ NON ASSERTE, MESURE : la forme courte `<?= ... ?>` est-elle couverte
          # par `echo $X;` ? Le correctif le SUPPOSE. On l'imprime plutot que de
          # l'affirmer — si elle ne l'est pas, il faudra une alternative regex.
          echo "── forme courte <?= ?> : $(jq '[.results[] | select(.path | endswith(".php")) | select(.start.line >= 6)] | length' /tmp/mord.json) trouvaille(s) au-dela de la ligne 6"

      - name: TEMOIN NEGATIF — les formes GARDEES ne doivent PAS mordre
        run: |
          set -euo pipefail
          semgrep --config .semgrep/rules-rootwarden.yml --metrics=off \
                  --json --no-git-ignore /tmp/mord-pas > /tmp/mordpas.json
          n=$(jq '.results | length' /tmp/mordpas.json)
          echo "  trouvailles sur les formes gardees : $n (0 attendu)"
          jq -r '.results[] | "  ⛔ \(.check_id | split(".") | last)  \(.path):\(.start.line)"' /tmp/mordpas.json
          [ "$n" -eq 0 ] || { echo "::error::une regle accuse une forme GARDEE"; exit 1; }

  sca-python:
    name: SCA Python (pip-audit)
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit on requirements
        working-directory: backend
        # Scan du requirements.txt fige. --strict = fail si CVE detectee.
        # Bloquant sur PR ET main depuis v1.17.0 (review securite).
        #
        # Exceptions documentees (a re-evaluer a chaque bump dependance) :
        #
        # PYSEC-2024-271 (flask-cors <=6.0.2)
        #   Log injection via CRLF dans le path d'une requete GET.
        #   Trigger : log level = DEBUG sur l'app Flask.
        #   Impact RootWarden : nul - prod tourne en INFO/WARN, debug uniquement
        #   sur preprod local. Pas de fix upstream (6.0.2 est la derniere version).
        #   A retirer quand flask-cors 6.0.3+ sort avec un patch.
        run: pip-audit -r requirements.txt --desc --strict --ignore-vuln PYSEC-2024-271

  # ─────────────────────────────────────────────────────────────
  # Job 4.4 : SCA PHP (composer audit - CVE sur dependances Composer)
  # ─────────────────────────────────────────────────────────────
  sca-php:
    name: SCA PHP (composer audit)
    runs-on: ubuntu-latest
    needs: lint-php
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      # ⚠ CE JOB N'AUDITAIT QUE LE LEGACY, ET C'EST UN JOB DE SECURITE.
      #
      # Les deux pas portaient `working-directory: legacy`. L'audit CVE couvrait
      # donc les dependances du LEGACY MORT et jamais celles du portage :
      #
      #     legacy/composer.lock    14 paquets prod +  0 dev   <- audite
      #     laravel/composer.lock   86 paquets prod + 33 dev   <- JAMAIS audite
      #     74 paquets exclusifs au portage, dont guzzlehttp/guzzle,
      #     egulias/email-validator, dragonmantank/cron-expression,
      #     fruitcake/php-cors
      #
      # ── MESURE AVANT DE CHANGER, ET SON TEMOIN ──────────────────────────────
      #
      # `composer audit --locked` sur `laravel/` rend « No security vulnerability
      # advisories found », code 0 (mesure du 2026-09-08 13:4x, en `www-data`,
      # cache hors de l'arbre).
      #
      # ⛔ Et ce vert ne voulait rien dire tant que l'instrument n'avait pas ete
      # eprouve : l'audit du legacy rendait AUSSI « rien trouve », donc deux zeros
      # identiques. TEMOIN POSITIF forge — une copie du verrou dans /tmp avec
      # `guzzlehttp/guzzle` retrograde de 7.15.3 a 6.5.0 — rend **14 avis
      # affectant 1 paquet**, avec de vrais identifiants CVE. **L'instrument mord,
      # donc le vert du portage est une mesure et non un silence.**
      #
      # ⚠ Au passage : CVE-2026-69246, severite haute, « Noncanonical host can
      # bypass host-based checks », versions affectees `<7.15.2`. Le portage est
      # en 7.15.3 — UN correctif au-dessus.
      #
      # ── `composer install` RETIRE ───────────────────────────────────────────
      #
      # `--locked` lit le VERROU : il n'a besoin ni de `vendor/` ni d'une
      # installation. Verifie au temoin, qui a audite une copie sans jamais
      # installer. Le job est donc plus couvrant ET plus rapide.
      - name: Composer audit — LES DEUX verrous
        run: |
          set -uo pipefail
          echec=0
          for d in laravel legacy; do
            if [ ! -f "$d/composer.lock" ]; then
              echo "::error::$d/composer.lock absent — les chemins ont bouge."
              echo "Ce job ECHOUE plutot que de passer sans avoir mesure."
              exit 1
            fi
            n=$(php -r '$v = json_decode(file_get_contents($argv[1]), true); echo count($v["packages"] ?? []) + count($v["packages-dev"] ?? []);' "$d/composer.lock")
            # ⚠ TEMOIN : un verrou qui ne declare AUCUN paquet rendrait « rien
            # trouve » sans avoir rien regarde.
            if [ "$n" -eq 0 ]; then
              echo "::error::$d/composer.lock ne declare aucun paquet."
              exit 1
            fi
            echo "── $d : $n paquet(s) verrouilles"
            if ! ( cd "$d" && composer audit --locked --format=plain ); then
              echec=1
            fi
          done
          # La clemence sur `pull_request` est CONSERVEE telle quelle : un avis
          # publie entre deux commits ne doit pas bloquer une PR sans rapport.
          # ⚠ Mais elle a un revers, dit ici plutot que tu : le bloquant ne joue
          # que sur `main`, donc un nouvel avis y arrive SANS avertissement
          # prealable. C'est une question ouverte, pas un choix mesure.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            [ "$echec" -eq 0 ] || echo "::warning::avis trouve(s) — non bloquant sur une PR"
            exit 0
          fi
          [ "$echec" -eq 0 ] || exit 1

  # ─────────────────────────────────────────────────────────────
  # Job 4.5 : Trivy fs - scan vulnerabilites au niveau du repo
  # (complement au scan des images Docker plus bas)
  # ─────────────────────────────────────────────────────────────
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy fs (requirements + composer + misconfig IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Scanne : requirements.txt, composer.lock, Dockerfiles, docker-compose.yml
          scanners: vuln,secret,misconfig

  # ─────────────────────────────────────────────────────────────
  # Job 5 : Scan securite images Docker (Trivy)
  # ─────────────────────────────────────────────────────────────
  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Laravel image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./laravel/Dockerfile
          push: false
          load: true
          tags: rootwarden-laravel:scan
          cache-from: type=gha

      - name: Build Python image for scan
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: rootwarden-python:scan
          cache-from: type=gha

      - name: Scan Laravel image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: rootwarden-laravel:scan
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan Python image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: rootwarden-python:scan
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ─────────────────────────────────────────────────────────────
  # Job 6 : Tag version automatique (depuis version.txt)
  # ─────────────────────────────────────────────────────────────
  auto-tag:
    name: Auto tag version
    runs-on: ubuntu-latest
    # ⚠ `test-php` et `test-python` ajoutes le 2026-09-04 (E-381). Sans eux, un ROUGE des
    # suites de tests N'EMPECHAIT RIEN : ce job pose une etiquette (`contents: write`), et
    # `maj.sh` TIRE une etiquette -> une compilation cassee devenait publiable en production.
    # C'est le seul point de passage AUTOMATIQUE vers la prod, et rien ne le gardait.
    # Mesure : run 33792110538 a conclu SUCCESS sur ce job alors que « Tests PHPUnit » etait
    # rouge. Un job vert de plus n'est pas une garde de plus ; ici c'est un ROUGE qui bloque
    # de plus. ⚠ Ne couvre PAS le code qui compile et qui casse (E-388, E-389, DOSSIER-25 :
    # trois defauts destructeurs qui auraient passe cette CI).
    needs: [build-docker, security-scan, secrets-scan, sast-python, sast-semgrep, sca-python, sca-php, trivy-fs,
            test-php, test-python]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deriver la version
        id: version
        # INF-004 : LA VERSION SE DERIVE, ELLE NE SE LIT PLUS.
        #
        # Cette etape lisait `legacy/version.txt`, c'est-a-dire un numero POSE A
        # LA MAIN — et le repli `|| echo "0.0.0"` transformait un fichier absent
        # en version plausible, donc en tag plausible. Un numero assigne est
        # valide au moment ou on l'ecrit, pas au moment ou un autre l'emploie :
        # trois commits de trois sessions ont revendique le meme le 2026-08-27.
        #
        # `scripts/version.sh` derive le correctif du depot lui-meme
        # (`--first-parent` depuis la derniere modification de `VERSION-JALON`),
        # et il ECHOUE plutot que de deviner. `fetch-depth: 0` ci-dessus est ce
        # qui le rend possible : sans l'historique complet, le compte serait faux.
        #
        # PAS DE CYCLE : la source est le fichier de jalon, jamais les tags — que
        # ce job produit. Deriver depuis les tags ferait du tag sa propre source.
        run: |
          VERSION=$(./scripts/version.sh)
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Version derivee : v${VERSION}"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
          echo "Tag ${{ steps.version.outputs.version }} created"
