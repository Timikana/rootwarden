# En-tetes de securite HTTP du portail — audit du 2026-10-13, H-1.
#
# ⚠ REGRESSION DE LA MIGRATION, CORRIGEE ICI. Le legacy posait HSTS, CSP,
# X-Frame-Options, nosniff et Referrer-Policy (`legacy/_deprecated/php/
# apache-http.conf.tmpl`, 9 directives ; CSP a nonce dans `auth/verify.php`).
# Le portail Laravel n'en posait AUCUN : `git grep` sur `laravel/` = 0, et aucun
# test ne les exigeait.
#
# ── POURQUOI UN FICHIER GLOBAL, ET POURQUOI « zz- » ───────────────────────────
#
# Global : avec `SSL_MODE=disabled`, le vhost TLS (`apache-ssl.conf.tmpl`) n'est
# pas rendu par l'entrypoint ; des en-tetes poses LA disparaitraient dans ce
# mode. Ici, ils valent pour tous les vhosts.
# « zz- » : `conf-enabled` se charge par ordre ALPHABETIQUE et la DERNIERE
# definition gagne (cf. le piege `ServerTokens` documente dans le Dockerfile).
# Ce fichier passe donc apres `security.conf`.
#
# `always` : les en-tetes partent AUSSI sur les reponses d'erreur (4xx/5xx,
# redirections), qui sont justement celles qu'on ne regarde pas.

# ── Transport ─────────────────────────────────────────────────────────────────
# HSTS seulement en HTTPS (`env=HTTPS`, pose par mod_ssl). Duree REGLABLE
# (`HSTS_MAX_AGE`, defaut 86400 = 1 jour, pose par l'entrypoint) : HSTS
# s'applique a TOUT le nom d'hote, tous ports confondus. Si un autre service
# est servi en HTTP sous le meme nom, il deviendrait injoignable pour la duree
# annoncee — un jour se rattrape, un an non. Monter a 31536000 une fois verifie.
# Pas d'`includeSubDomains`, pas de `preload` : ils engagent d'autres hotes.
Header always set Strict-Transport-Security "max-age=${HSTS_MAX_AGE}" env=HTTPS

# ── Contenu ───────────────────────────────────────────────────────────────────
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# CSP APPLIQUEE : uniquement les directives qui ne touchent ni aux scripts ni
# aux styles, donc qui ne peuvent rien casser — et qui ferment le clickjacking
# (`frame-ancestors`), l'injection de `<base>`, les greffons, et l'envoi de
# formulaires vers une autre origine (inventaire du 2026-10-13 : 0 formulaire
# externe).
Header always set Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

# CSP CIBLE, en RAPPORT SEULEMENT. Inventaire du 2026-10-13 de ce qu'elle
# casserait si on l'appliquait : 2 scripts en ligne (`composants/theme*.blade.php`),
# 8 gestionnaires `on…=` (politiques, acces-sftp, tickets, mises-a-jour,
# cles-ssh, rapport-conformite), 5 attributs `style=`. Les retirer, puis passer
# cette ligne en `Content-Security-Policy`.
Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

# ── Divulgation ───────────────────────────────────────────────────────────────
# PHP annonce sa version (`X-Powered-By: PHP/8.4.x`) tant que `expose_php` n'est
# pas coupe. Retire ici, dans les deux tables d'en-tetes.
Header unset X-Powered-By
Header always unset X-Powered-By
