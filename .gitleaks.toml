title = "RootWarden gitleaks config"

# Utilise la baseline par defaut de gitleaks (regex pour AWS keys, GitHub tokens,
# stripe keys, slack tokens, generic private keys, etc.) et ajoute nos patterns.

[extend]
useDefault = true

# ── Allowlist : patterns qui peuvent matcher mais qu'on veut ignorer ──────────

[[rules]]
id = "rootwarden-example-secret"
description = "Placeholder strings dans srv-docker.env.example et docs"
regex = '''(?i)\b(change[_-]?me|replace[_-]?me|your[_-]?key[_-]?here|openssl[[:space:]]+rand)\b'''
# Ces chaines apparaissent dans les .example - pas de secret reel
[rules.allowlist]
regexes = ['''(?i)example''']

# ── Allowlist globale ─────────────────────────────────────────────────────────

[allowlist]
# Fichiers systematiquement ignores
paths = [
    '''(?i)\.example$''',
    '''srv-docker\.env\.example''',
    '''README(\.[a-z]+)?\.md''',
    '''CHANGELOG\.md''',
    '''ARCHITECTURE\.md''',
    '''backend/bandit\.yml''',        # config scanner, contient des justifications prose
    '''tests/e2e/helpers\.mjs''',     # contient un TOTP_SECRET de test documente
    '''tests/e2e/go-page-notifications-portee\.mjs''',  # idem : COMPTES rw-test-* (TOTP de test)
    '''mysql/init\.sql''',
    '''legacy/vendor/''',
    '''backend/tests/''',
    '''obsidian-rootwarden/''',       # vault documentation : placeholders pedagogiques (openssl rand, etc.)
    '''docs/''',                       # documentation technique avec exemples de commandes
    # ── ARCHIVE, ET L'EXEMPTION NOMME LE MECANISME PAS LE PAS ────────────────
    #
    # `legacy/_deprecated/php/install.sh:75` porte `openssl rand -base64 18`
    # DANS une fonction `generate_password()`. Ce n'est pas un secret : c'est
    # l'APPEL QUI EN FABRIQUE UN. Aucune valeur n'est presente dans le fichier,
    # ni en clair ni en gabarit — le mot de passe genere part vers un volume au
    # premier demarrage du conteneur, lequel est RETIRE depuis le 2026-09-09.
    #
    # ⚠ POURQUOI CETTE ENTREE APPARAIT AUJOURD'HUI ALORS QUE LE FICHIER N'A PAS
    #   CHANGE : gitleaks lit le DIFF des commits de la reference. Le fichier
    #   vivait a `php/install.sh` et n'etait exempte NULLE PART — verifie sur
    #   `origin/main`, 0 entree le citant. C'est le `git mv` qui a re-presente
    #   son contenu ENTIER comme des lignes ajoutees.
    #
    #   > Deplacer un fichier le re-expose integralement a un scanner de diff.
    #
    #   Sur les 13 fichiers archives ce jour, un seul porte un motif de la
    #   regle — la trouvaille de la CI etait donc complete.
    #
    # ⛔ ET C'EST UNE ENTREE DE CHEMIN PRECISE, PAS `legacy/_deprecated/` :
    #   exempter l'archive entiere aveuglerait le scanner sur 235 fichiers, dont
    #   222 `.php` de l'ancien portail. Un secret reel qu'on archiverait
    #   cesserait d'etre vu — et l'archivage est precisement le moment ou
    #   personne ne relit.
    '''legacy/_deprecated/php/install\.sh''',
]

# Commentaires explicites "not-a-secret"
regexes = [
    '''not[_-]?a[_-]?secret''',
    '''test[_-]?(api[_-]?)?key[_-]?for[_-]?ci''',
]
